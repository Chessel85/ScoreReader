[pytest]
testpaths = tests

# Put the project root on sys.path so tests can import models/, parsers/,
# widgets/, audio/ and main_window the same way the app does.
pythonpath = .

addopts = -q --strict-markers

markers =
    slow: invokes music21 parsing (~0.5s per call). Timeline tests should
        build MusicData directly instead - it uses ElementTree only and is
        roughly 460x faster. Run without these: pytest -m "not slow"
