; Example config for wav_to_sf2.py - a starting template for Recall
; Score's position announcer (Ref 28) and click metronome (Ref 14) sound
; packs. Copy this file, point the WAV paths at your own recordings, and
; run:
;     python wav_to_sf2.py my_config.ini
;
; Paths below are relative to THIS file's own location.

[sf2]
name = Recall Score Sounds
output = recall_score_sounds.sf2

; --- Position announcer (Ref 28) ------------------------------------------
; One note per spoken word. This note layout (60-69, in this order) is the
; convention audio/position_announcer.py expects - keep it if you want this
; preset to work without any app-side code changes. Add more
; [preset:talking_metronome_*] sections, each its own program number, for
; alternative voices - the app picks between them by MIDI program select.
[preset:talking_metronome_default]
bank = 0
program = 0
60 = words/one.wav | one
61 = words/two.wav | two
62 = words/three.wav | three
63 = words/four.wav | four
64 = words/five.wav | five
65 = words/six.wav | six
66 = words/seven.wav | seven
67 = words/e.wav | e
68 = words/and.wav | and
69 = words/a.wav | a

; --- Click metronome (Ref 14) ---------------------------------------------
; Two notes: the regular click and the accented (beat 1) click. Add more
; [preset:click_*] sections, each its own program number, for alternative
; click sounds (tasks.txt E11/D-14 - the built-in synthesized/GM-percussion
; attempts were both rejected as unsatisfying; this is the replacement path).
[preset:click_default]
bank = 0
program = 1
60 = clicks/click.wav | click
61 = clicks/accent.wav | accent
