; run:
;     python wav_to_sf2.py my_config.ini
; Paths below are relative to THIS file's own location.

[sf2]
name = Recall Score Sounds
output = recall_score_sounds.sf2

;speaking metronome 
[preset:talking_metronome_default]
bank = 0
program = 0
60 = words1/one.wav | one
61 = words1/two.wav | two
62 = words1/three.wav | three
63 = words1/four.wav | four
64 = words1/five.wav | five
65 = words1/six.wav | six
66 = words1/seven.wav | seven
67 = words1/e.wav | e
68 = words1/and.wav | and
69 = words1/a.wav | a

;click1 metronome sounds
[preset:click_default]
bank = 0
program = 1
60 = click1/accent.wav | accent
61 = click1/offbeat.wav | offbeat

;performance region change indicator
[preset:performance_region_change]
bank = 0
program = 2
60 = bells/smallBell.wav | performanceAlert

;hands-free voice control: confirms a spoken command was recognized and
;acted upon. Reused click1/offbeat.wav at first (reusing bells/smallBell.wav,
;like performance_region_change, made the two indistinguishable by ear) -
;replaced with a dedicated double-beep clip the user recorded, per the same
;"needs to be audibly distinct" report. See audio/voice_confirmation_cue.py.
;normalize: the user's recorded clip came in at 25-33% of full scale (2-3x
;quieter than every other sound in this file - click1/offbeat.wav alone is
;99.5%), confirmed by direct measurement, not a code-side reduction anywhere
;in this app's playback path - see wav_to_sf2.py's own note on this key.
[preset:voice_command_confirmation]
bank = 0
program = 3
normalize = true
60 = voice_control/DoubleBeep.wav | voiceCommandConfirmation

;hands-free voice control: confirms listening was turned on/off (Toggle
;Voice Control, Ctrl+Enter/Return) - distinct from the per-command
;confirmation ding above, which only ever fires while already listening.
[preset:voice_recognition_started]
bank = 0
program = 4
normalize = true
60 = voice_control/SRStart.wav | voiceRecognitionStarted

[preset:voice_recognition_stopped]
bank = 0
program = 5
normalize = true
60 = voice_control/SREnd.wav | voiceRecognitionStopped
