; run:
;     python wav_to_sf2.py my_config.ini
; Paths below are relative to THIS file's own location.

[sf2]
name = Recall Score Sounds
output = recall_score_sounds.sf2

;speaking metronome 
[preset:talking_metronome_default]
bank = 0
program = 0
60 = words1/one.wav | one
61 = words1/two.wav | two
62 = words1/three.wav | three
63 = words1/four.wav | four
64 = words1/five.wav | five
65 = words1/six.wav | six
66 = words1/seven.wav | seven
67 = words1/e.wav | e
68 = words1/and.wav | and
69 = words1/a.wav | a

;click1 metronome sounds
[preset:click_default]
bank = 0
program = 1
60 = click1/accent.wav | accent
61 = click1/offbeat.wav | offbeat

;performance region change indicator
[preset:performance_region_change]
bank = 0
program = 2
60 = bells/smallBell.wav | performanceAlert

;hands-free voice control: confirms a spoken command was recognized and
;acted upon. Reported live: reusing the bells/smallBell.wav sample (like
;performance_region_change) made the two indistinguishable by ear -
;reusing click1/offbeat.wav instead as a placeholder until a dedicated
;"ding" clip is recorded - see audio/voice_confirmation_cue.py.
[preset:voice_command_confirmation]
bank = 0
program = 3
60 = click1/offbeat.wav | voiceCommandConfirmation
